openapi: 3.0.3
info:
  title: Atlas Knowledge API
  description: |
    API REST da wiki corporativa Atlas Knowledge.

    **Autenticação:** faça login em `POST /api/v1/auth/login`, copie o `accessToken` e clique em **Authorize** (cadeado) informando `Bearer SEU_TOKEN`.
  version: 1.0.0

servers:
  - url: /
    description: Servidor atual (mesmo host do navegador)

tags:
  - name: health
  - name: auth
  - name: users
  - name: ai-settings
  - name: dashboard
  - name: observability
  - name: search
  - name: projects
  - name: sections
  - name: lessons
  - name: attachments
  - name: mnemos

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      description: Verifica se a API e o banco estão respondendo.
      responses:
        '200':
          description: API e banco respondendo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  database:
                    type: string
                    example: disconnected

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@example.com
                password:
                  type: string
                  example: sua-senha
      responses:
        '200':
          description: Token de acesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Renovar access token (cookie refresh_token)
      responses:
        '200':
          description: Novo access token

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sem conteúdo

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário

  /api/v1/auth/password:
    patch:
      tags: [auth]
      summary: Trocar senha do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: senha-atual
                newPassword:
                  type: string
                  minLength: 8
                  example: nova-senha
      responses:
        '204':
          description: Senha atualizada
        '400':
          description: Senha atual inválida
        '401':
          description: Não autenticado
        '422':
          description: Nova senha inválida

  /api/v1/users:
    get:
      tags: [users]
      summary: Listar usuários ativos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
    post:
      tags: [users]
      summary: Criar usuário
      description: Apenas administradores.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [admin, consultor, desenvolvedor] }
      responses:
        '201':
          description: Usuário criado
        '403':
          description: Sem permissão
        '409':
          description: E-mail já em uso

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Obter usuário por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usuário
        '404':
          description: Usuário não encontrado
    patch:
      tags: [users]
      summary: Atualizar usuário
      description: Apenas administradores. Senha é opcional.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [admin, consultor, desenvolvedor] }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Usuário atualizado
        '404':
          description: Usuário não encontrado
    delete:
      tags: [users]
      summary: Excluir usuário
      description: Soft delete (is_active=false). Apenas administradores.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Usuário excluído
        '404':
          description: Usuário não encontrado

  /api/v1/ai-settings:
    get:
      tags: [ai-settings]
      summary: Obter configurações de IA
      description: |
        Retorna provider, model, baseUrl e se a API key está configurada (sem expor a chave).
        Apenas admin.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configurações públicas (chave mascarada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsPublic'
        '403':
          description: Apenas admin
    put:
      tags: [ai-settings]
      summary: Atualizar configurações de IA
      description: |
        Persiste `AI_PROVIDER`, `AI_MODEL`, `AI_BASE_URL` e `AI_API_KEY` na tabela `ai_settings`.
        Se `apiKey` for omitido, a chave atual é mantida. Apenas admin.
        O Mnemos recebe esses valores no multipart da geração e via `GET /internal/ai-settings`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISettingsUpdate'
      responses:
        '200':
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsPublic'
        '403':
          description: Apenas admin

  /api/v1/internal/ai-settings:
    get:
      tags: [mnemos]
      summary: Configurações de IA (Mnemos)
      description: |
        Endpoint máquina-a-máquina com a chave completa.
        Auth: `X-Api-Key` (`MNEMOS_API_KEY`) ou JWT admin.
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Credenciais para o provedor de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsInternal'

  /api/v1/dashboard/summary:
    get:
      tags: [dashboard]
      summary: Resumo do dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indicadores e atualizações recentes

  /api/v1/observability/executions:
    get:
      tags: [observability]
      summary: Listar execuções do Mnemos (resumo)
      description: |
        Proxy autenticado de `GET {AI_SERVICE_URL}/v1/observability/executions`.
        Filtra execuções pelos projetos acessíveis ao usuário (admin vê todas).
        Usado pela tela de dashboard para custos, timings e status de RAG/ingest.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            example: 20
        - name: operation
          in: query
          schema:
            type: string
            enum: [question_answering, document_processing]
          example: question_answering
        - name: provider
          in: query
          schema:
            type: string
            example: openai
        - name: project_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            example: completed
        - name: model
          in: query
          schema:
            type: string
            example: gpt-4o-mini
      responses:
        '200':
          description: Lista resumida (sem stages/documents/costs/errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/observability/executions/{id}:
    get:
      tags: [observability]
      summary: Detalhe de uma execução do Mnemos
      description: |
        Proxy autenticado de `GET {AI_SERVICE_URL}/v1/observability/executions/{id}`.
        Inclui stages, documents, costs e errors.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Execução completa com filhos
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Execução não encontrada

  /api/v1/search:
    get:
      tags: [search]
      summary: Busca global
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
          description: Termo de busca (mínimo 3 caracteres; consultas menores retornam listas vazias sem acessar o banco).
          example: wiki
      responses:
        '200':
          description: Resultados agrupados

  /api/v1/rag/search:
    post:
      tags: [search]
      summary: Busca semântica RAG via Mnemos
      description: |
        Autentica o usuário, filtra `project_ids` pelos projetos acessíveis
        e encaminha a pergunta ao Mnemos (`POST /v1/rag/search`).
        Se `project_ids` for omitido ou vazio, usa todos os projetos que o usuário pode ler.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: Quais são os requisitos de autenticação?
                project_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Opcional; subset dos projetos acessíveis
      responses:
        '200':
          description: Resposta com fontes
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: string
                        project_name:
                          type: string
                        kind:
                          type: string
                        source_type:
                          type: string
                        source_id:
                          type: string
                        title:
                          type: string
                        score:
                          type: number
                  chunks_used:
                    type: integer
                  score:
                    type: number
        '403':
          description: Sem projetos acessíveis
        '422':
          description: question ausente
        '502':
          description: Mnemos indisponível ou RAG desabilitado

  /api/v1/projects:
    get:
      tags: [projects]
      summary: Listar projetos
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, done]
        - name: q
          in: query
          schema:
            type: string
        - name: responsible
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Data inicial de criação (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: to
          in: query
          description: Data final de criação (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2026-07-31'
      responses:
        '200':
          description: Lista resumida de projetos
    post:
      tags: [projects]
      summary: Criar projeto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Projeto criado

  /api/v1/projects/{slug}:
    get:
      tags: [projects]
      summary: Detalhe do projeto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: ProjectResponse completo
    patch:
      tags: [projects]
      summary: Atualizar projeto (parcial)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [active, paused, done]
                responsibleUserId:
                  type: string
                  format: uuid
                client:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                tech:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Projeto atualizado
    delete:
      tags: [projects]
      summary: Remover projeto (admin, soft delete)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '204':
          description: Removido

  /api/v1/projects/{slug}/readers:
    put:
      tags: [projects]
      summary: Definir leitores do projeto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '204':
          description: Atualizado

  /api/v1/projects/{slug}/sections:
    post:
      tags: [sections]
      summary: Criar seção
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                content:
                  type: string
                parentId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Seção criada

  /api/v1/projects/{slug}/sections/{sectionId}:
    patch:
      tags: [sections]
      summary: Atualizar seção
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Seção atualizada
    delete:
      tags: [sections]
      summary: Remover seção (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removida

  /api/v1/projects/{slug}/sections/reorder:
    put:
      tags: [sections]
      summary: Reordenar seções
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      parentId:
                        type: string
                        nullable: true
                      sortOrder:
                        type: integer
      responses:
        '204':
          description: Reordenado

  /api/v1/projects/{slug}/lessons:
    post:
      tags: [lessons]
      summary: Criar lição aprendida
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
      responses:
        '201':
          description: Lição criada

  /api/v1/projects/{slug}/lessons/{lessonId}:
    patch:
      tags: [lessons]
      summary: Atualizar lição
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
      responses:
        '200':
          description: Lição atualizada
    delete:
      tags: [lessons]
      summary: Remover lição
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removida

  /api/v1/projects/{slug}/attachments:
    post:
      tags: [attachments]
      summary: Upload de anexo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Anexo criado

  /api/v1/projects/{slug}/attachments/{attachmentId}:
    delete:
      tags: [attachments]
      summary: Remover anexo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removido

  /api/v1/files/{fileId}/download:
    get:
      tags: [attachments]
      summary: Download de arquivo
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stream do arquivo

  /api/v1/mnemos/projects:
    post:
      tags: [mnemos]
      summary: Criar ou atualizar projeto (payload Atlas do Mnemos)
      description: |
        Aceita `project` + `sections[]` no formato DocumentResult do Mnemos.
        Se o slug já existir, atualiza metadados e (por padrão) substitui as seções.
        Auth: Bearer JWT (admin) ou header `X-Api-Key` (`MNEMOS_API_KEY`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MnemosSyncRequest'
      responses:
        '201':
          description: Projeto criado
        '200':
          description: Projeto atualizado

  /api/v1/mnemos/projects/{slug}:
    patch:
      tags: [mnemos]
      summary: Atualizar metadados do projeto
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [active, paused, done, cancelled]
                client:
                  type: string
                responsibleUserId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Projeto atualizado

  /api/v1/mnemos/projects/{slug}/structure:
    put:
      tags: [mnemos]
      summary: Aplicar árvore de seções (formato Mnemos)
      description: |
        Substitui (padrão) ou acrescenta seções com `temp_id` / `parent_temp_id`,
        `kind` doc|dev e `content` em Markdown.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sections]
              properties:
                replaceSections:
                  type: boolean
                  default: true
                sections:
                  type: array
                  items:
                    $ref: '#/components/schemas/MnemosSection'
      responses:
        '200':
          description: Estrutura aplicada

  /api/v1/mnemos/projects/{slug}/attachments:
    post:
      tags: [mnemos]
      summary: Anexar arquivos ao projeto
      description: |
        Multipart com `files` (ou `file`). Campo opcional `meta` (JSON) com
        `attachments[]` do Mnemos (`source_filename`, `display_name`, `kind`).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                meta:
                  type: string
                  description: JSON array ou {"attachments":[...]}
      responses:
        '201':
          description: Anexos criados

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Valor de MNEMOS_API_KEY

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      example: meu-projeto

  schemas:
    AISettingsPublic:
      type: object
      properties:
        provider:
          type: string
          example: openai
        model:
          type: string
          example: gpt-5.6-luna
        baseUrl:
          type: string
          example: https://api.openai.com/v1
        apiKeyConfigured:
          type: boolean
        apiKeyPreview:
          type: string
          example: sk-p…xxxx
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time

    AISettingsUpdate:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
          enum: [openai, anthropic, gemini, ollama, azure]
        model:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
          description: Omitir para manter a chave atual; string vazia limpa a chave

    AISettingsInternal:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        api_key:
          type: string
        base_url:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            role:
              type: string
              enum: [admin, user]

    CreateProjectRequest:
      type: object
      required: [name, description, responsibleUserId]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, paused, done]
        responsibleUserId:
          type: string
